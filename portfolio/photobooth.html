<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dream booth</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400;1,900&family=DM+Mono:ital,wght@0,400;1,400&family=Unbounded:wght@300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f5f0e8;
            --black: #1a1208;
            --red: #e8341c;
            --yellow: #f5c842;
            --blue: #2d5be3;
            --green: #3aab6f;
            --paper: #fdf8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--cream);
            min-height: 100vh;
            color: var(--black);
            overflow-x: hidden;
            position: relative;
        }

        /* Hand-drawn grid background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--black) 1px, transparent 1px),
                linear-gradient(90deg, var(--black) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
        }

        /* Big background text */
        .bg-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-8deg);
            font-family: 'Unbounded', sans-serif;
            font-weight: 900;
            font-size: clamp(80px, 18vw, 260px);
            color: var(--black);
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
            white-space: nowrap;
            letter-spacing: -0.04em;
        }

        /* Layout */
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 2rem 4rem;
        }

        /* Header */
        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 4rem;
            border-bottom: 3px solid var(--black);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 900;
            font-size: clamp(2.5rem, 6vw, 5rem);
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--black);
        }

        .logo span {
            color: var(--red);
        }

        .header-tag {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            opacity: 0.5;
            text-align: right;
            line-height: 1.8;
        }

        /* Main grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 3rem;
            align-items: start;
        }

        @media (max-width: 800px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* Camera card */
        .camera-card {
            border: 3px solid var(--black);
            background: var(--paper);
            position: relative;
        }

        /* Corner accents */
        .camera-card::before,
        .camera-card::after {
            content: "+";
            position: absolute;
            font-size: 1.5rem;
            font-weight: 900;
            line-height: 1;
            color: var(--red);
        }
        .camera-card::before { top: -14px; left: -10px; }
        .camera-card::after { bottom: -14px; right: -10px; }

        .card-header {
            border-bottom: 3px solid var(--black);
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--black);
            color: var(--cream);
        }

        .card-header-label {
            font-family: 'Unbounded', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
        }

        .card-header-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--red);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* Camera view */
        .camera-view {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #111;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            transition: all 0.3s;
        }

        /* Scanline effect on video */
        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0,0,0,0.07) 3px,
                rgba(0,0,0,0.07) 4px
            );
            pointer-events: none;
            z-index: 5;
        }

        /* Corner crosshairs */
        .crosshair {
            position: absolute;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 6;
        }
        .crosshair::before, .crosshair::after {
            content: "";
            position: absolute;
            background: white;
            opacity: 0.7;
        }
        .crosshair.tl { top: 12px; left: 12px; }
        .crosshair.tr { top: 12px; right: 12px; }
        .crosshair.bl { bottom: 12px; left: 12px; }
        .crosshair.br { bottom: 12px; right: 12px; }

        .crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
        .crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

        /* Flash + countdown */
        .flash-effect {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
        }
        .flash-active { animation: flashAnim 0.3s ease-out forwards; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Unbounded', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: white;
            mix-blend-mode: difference;
            z-index: 30;
            display: none;
            pointer-events: none;
            text-shadow: 0 0 40px rgba(255,255,255,0.8);
        }

        /* Filter row */
        .filter-row {
            padding: 1rem 1.25rem;
            border-bottom: 2px solid var(--black);
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .filter-pill {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.3rem 0.8rem;
            border: 2px solid var(--black);
            background: transparent;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--black);
        }

        .filter-pill:hover { background: var(--yellow); }
        .filter-pill.active { background: var(--black); color: var(--cream); }

        /* Controls */
        .controls {
            padding: 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            justify-content: space-between;
        }

        .btn {
            font-family: 'Unbounded', sans-serif;
            font-weight: 900;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.8rem 1.5rem;
            border: 3px solid var(--black);
            background: transparent;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            color: var(--black);
        }

        /* Offset shadow */
        .btn::after {
            content: "";
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 100%;
            height: 100%;
            border: 3px solid var(--black);
            z-index: -1;
            transition: all 0.15s;
        }

        .btn:hover {
            transform: translate(-3px, -3px);
        }
        .btn:hover::after {
            bottom: -9px;
            right: -9px;
        }
        .btn:active {
            transform: translate(0, 0);
        }
        .btn:active::after {
            bottom: -3px;
            right: -3px;
        }

        .btn-red { background: var(--red); color: white; border-color: var(--black); }
        .btn-blue { background: var(--blue); color: white; }
        .btn-yellow { background: var(--yellow); }

        /* Status */
        .status-bar {
            padding: 0.6rem 1.25rem;
            border-top: 2px solid var(--black);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            min-height: 2.2rem;
            font-style: italic;
            color: var(--black);
            opacity: 0.6;
        }

        /* Strip panel */
        .strip-panel {
            border: 3px solid var(--black);
            background: var(--paper);
            position: relative;
        }

        .strip-panel-header {
            border-bottom: 3px solid var(--black);
            padding: 0.6rem 1rem;
            background: var(--yellow);
            font-family: 'Unbounded', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 900;
        }

        /* The physical photo strip */
        .photostrip {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
            margin: 16px;
            box-shadow: 4px 4px 0 var(--black);
            border: 2px solid var(--black);
            position: relative;
        }

        /* Film holes */
        .film-holes {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }

        .film-hole {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #ccc;
            background: #e8e8e8;
        }

        .strip-photo {
            width: 100%;
            aspect-ratio: 4/3;
            background: #e8e8e8;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            position: relative;
        }

        .strip-photo .placeholder-num {
            font-family: 'Unbounded', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #ccc;
        }

        .strip-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .strip-footer {
            padding: 6px 0 4px;
            text-align: center;
            border-top: 1px dashed #bbb;
            margin-top: 4px;
        }

        .strip-timestamp {
            font-family: 'DM Mono', monospace;
            font-size: 0.55rem;
            color: #aaa;
            letter-spacing: 0.08em;
        }

        .strip-caption {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1rem;
            color: #555;
            border: none;
            outline: none;
            width: 100%;
            text-align: center;
            background: transparent;
            margin-top: 4px;
        }

        .strip-caption::placeholder {
            color: #bbb;
        }

        .download-wrap {
            padding: 1rem;
            border-top: 2px solid var(--black);
        }

        .hidden { display: none !important; }

        /* Loading screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.6s ease;
        }

        .load-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 900;
            font-size: 4rem;
            color: var(--cream);
            letter-spacing: -0.03em;
            margin-bottom: 2rem;
        }

        .load-title span { color: var(--red); }

        .load-bar-wrap {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
        }

        .load-bar {
            height: 100%;
            background: var(--yellow);
            width: 0%;
            animation: loadFill 1.4s ease-out forwards;
        }

        @keyframes loadFill {
            0% { width: 0%; }
            60% { width: 70%; }
            100% { width: 100%; }
        }

        .load-sub {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 1rem;
        }

        /* Decorative side number */
        .side-num {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

    </style>
</head>
<body>

<div id="loading-screen">
    <div class="load-title">dream<span>.</span>booth</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="load-sub">warming up</div>
</div>

<div class="bg-text">CLICK</div>
<div class="side-num">photo&nbsp;strip&nbsp;machine&nbsp;//&nbsp;v.01</div>

<div class="wrap">
    <header>
        <div class="logo">dream<span>.</span>booth</div>
        <div class="header-tag">
            photo strip machine<br>
            — analog dreams, digital film —
        </div>
    </header>

    <div class="main-grid">

        <!-- Camera -->
        <div class="camera-section">
            <div class="camera-card">
                <div class="card-header">
                    <div class="card-header-label">live feed</div>
                    <div class="card-header-dot"></div>
                </div>
                <div class="camera-view">
                    <video id="video" autoplay playsinline></video>
                    <div id="video-overlay" class="video-overlay"></div>
                    <div class="scanlines"></div>
                    <div class="crosshair tl"></div>
                    <div class="crosshair tr"></div>
                    <div class="crosshair bl"></div>
                    <div class="crosshair br"></div>
                    <div id="flash" class="flash-effect"></div>
                    <div id="countdown" class="countdown">3</div>
                </div>

                <div class="filter-row">
                    <div class="filter-pill active" data-filter="none">raw</div>
                    <div class="filter-pill" data-filter="vintage">vintage</div>
                    <div class="filter-pill" data-filter="dreamy">dreamy</div>
                    <div class="filter-pill" data-filter="bw">b+w</div>
                    <div class="filter-pill" data-filter="pink">blush</div>
                    <div class="filter-pill" data-filter="disposable">disposable</div>
                </div>

                <div class="controls">
                    <button id="start-btn" class="btn btn-red">start camera</button>
                    <button id="capture-btn" class="btn btn-blue hidden">shoot 4 frames</button>
                    <button id="retake-btn" class="btn hidden">retake</button>
                </div>

                <div class="status-bar" id="status-msg">ready when you are.</div>
            </div>
        </div>

        <!-- Strip preview -->
        <div class="strip-panel">
            <div class="strip-panel-header">your strip</div>

            <div class="photostrip" id="photostrip">
                <div class="film-holes">
                    <div class="film-hole"></div>
                    <div class="film-hole"></div>
                    <div class="film-hole"></div>
                    <div class="film-hole"></div>
                    <div class="film-hole"></div>
                </div>
                <div class="strip-photo" id="photo-0"><span class="placeholder-num">1</span></div>
                <div class="strip-photo" id="photo-1"><span class="placeholder-num">2</span></div>
                <div class="strip-photo" id="photo-2"><span class="placeholder-num">3</span></div>
                <div class="strip-photo" id="photo-3"><span class="placeholder-num">4</span></div>
                <div class="film-holes">
                    <div class="film-hole"></div>
                    <div class="film-hole"></div>
                    <div class="film-hole"></div>
                    <div class="film-hole"></div>
                    <div class="film-hole"></div>
                </div>
                <div class="strip-footer">
                    <div class="strip-timestamp" id="timestamp">YYYY.MM.DD / HH:MM</div>
                    <input type="text" class="strip-caption" placeholder="add a title..." maxlength="20">
                </div>
            </div>

            <div class="download-wrap">
                <button id="download-btn" class="btn btn-yellow hidden" style="width:100%">save strip</button>
            </div>
        </div>

    </div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('start-btn');
    const captureBtn = document.getElementById('capture-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const downloadBtn = document.getElementById('download-btn');
    const countdownEl = document.getElementById('countdown');
    const flashEl = document.getElementById('flash');
    const statusMsg = document.getElementById('status-msg');
    const videoOverlay = document.getElementById('video-overlay');
    const loadingScreen = document.getElementById('loading-screen');
    const timestampEl = document.getElementById('timestamp');

    let stream = null;
    let capturedPhotos = [];
    let currentFilter = 'none';

    window.addEventListener('load', () => {
        setTimeout(() => {
            loadingScreen.style.opacity = '0';
            setTimeout(() => loadingScreen.classList.add('hidden'), 600);
        }, 1600);
    });

    async function startCamera() {
        try {
            statusMsg.innerText = 'requesting camera access...';
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 960 } },
                audio: false
            });
            video.srcObject = stream;
            startBtn.classList.add('hidden');
            captureBtn.classList.remove('hidden');
            statusMsg.innerText = 'camera live. hit shoot when ready.';
        } catch(err) {
            statusMsg.innerText = 'camera access denied. check permissions.';
        }
    }

    startBtn.addEventListener('click', startCamera);

    async function captureSequence() {
        capturedPhotos = [];
        captureBtn.disabled = true;
        retakeBtn.classList.add('hidden');
        downloadBtn.classList.add('hidden');

        for(let i = 0; i < 4; i++) {
            document.getElementById(`photo-${i}`).innerHTML = `<span class="placeholder-num">${i+1}</span>`;
        }

        for(let i = 0; i < 4; i++) {
            statusMsg.innerText = `frame ${i+1} of 4 — hold still.`;
            await runCountdown(3);

            flashEl.classList.add('flash-active');
            setTimeout(() => flashEl.classList.remove('flash-active'), 300);

            const photoData = capturePhoto();
            capturedPhotos.push(photoData);

            const slot = document.getElementById(`photo-${i}`);
            slot.innerHTML = `<img src="${photoData}" alt="frame ${i+1}">`;

            await new Promise(r => setTimeout(r, 900));
        }

        statusMsg.innerText = 'done. all 4 frames captured.';
        updateTimestamp();
        captureBtn.disabled = false;
        captureBtn.classList.add('hidden');
        retakeBtn.classList.remove('hidden');
        downloadBtn.classList.remove('hidden');
    }

    function runCountdown(seconds) {
        return new Promise(resolve => {
            let count = seconds;
            countdownEl.innerText = count;
            countdownEl.style.display = 'block';
            const timer = setInterval(() => {
                count--;
                if(count <= 0) {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    resolve();
                } else {
                    countdownEl.innerText = count;
                }
            }, 1000);
        });
    }

    function capturePhoto() {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        const w = canvas.width, h = canvas.height;

        if(currentFilter === 'vintage') { ctx.fillStyle = 'rgba(255,150,0,0.1)'; ctx.fillRect(0,0,w,h); }
        else if(currentFilter === 'dreamy') { ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(0,0,w,h); }
        else if(currentFilter === 'pink') { ctx.fillStyle = 'rgba(255,105,180,0.15)'; ctx.fillRect(0,0,w,h); }

        // Grain
        for(let i = 0; i < 4000; i++) {
            ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.05})`;
            ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1);
        }

        return canvas.toDataURL('image/png');
    }

    captureBtn.addEventListener('click', captureSequence);

    retakeBtn.addEventListener('click', () => {
        capturedPhotos = [];
        for(let i = 0; i < 4; i++) {
            document.getElementById(`photo-${i}`).innerHTML = `<span class="placeholder-num">${i+1}</span>`;
        }
        retakeBtn.classList.add('hidden');
        downloadBtn.classList.add('hidden');
        captureBtn.classList.remove('hidden');
        statusMsg.innerText = 'reset. try again.';
    });

    document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            currentFilter = pill.dataset.filter;
            video.style.filter = getCSSFilter(currentFilter);
        });
    });

    function getCSSFilter(f) {
        switch(f) {
            case 'vintage': return 'sepia(0.4) contrast(1.1)';
            case 'dreamy': return 'brightness(1.1) saturate(1.2) blur(0.4px)';
            case 'bw': return 'grayscale(1) contrast(1.3)';
            case 'pink': return 'hue-rotate(-20deg) saturate(1.3)';
            case 'disposable': return 'contrast(1.15) saturate(1.4) brightness(0.9)';
            default: return 'none';
        }
    }

    function updateTimestamp() {
        const n = new Date();
        const d = n.getFullYear() + '.' + String(n.getMonth()+1).padStart(2,'0') + '.' + String(n.getDate()).padStart(2,'0');
        const t = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
        timestampEl.innerText = `${d} / ${t}`;
    }

    async function generateFinalStrip() {
        const sc = document.createElement('canvas');
        const ctx = sc.getContext('2d');

        const pw = 800, ph = 600, pad = 50, sp = 20, footerH = 160;
        sc.width = pw + pad * 2;
        sc.height = (ph * 4) + (sp * 3) + (pad * 2) + footerH;

        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, sc.width, sc.height);

        // Film holes
        const holeY = [pad/2 - 8, sc.height - pad/2 - 8];
        ctx.fillStyle = '#ddd';
        for(let row of holeY) {
            for(let x = 20; x < sc.width - 20; x += 30) {
                ctx.beginPath();
                ctx.arc(x, row + 8, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for(let i = 0; i < 4; i++) {
            const img = new Image();
            img.src = capturedPhotos[i];
            await new Promise(r => img.onload = r);
            ctx.drawImage(img, pad, pad + i * (ph + sp), pw, ph);
        }

        ctx.fillStyle = '#aaa';
        ctx.font = '22px "DM Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(timestampEl.innerText, sc.width / 2, sc.height - 110);

        const caption = document.querySelector('.strip-caption').value;
        if(caption) {
            ctx.fillStyle = '#444';
            ctx.font = 'italic 900 60px "Playfair Display", serif';
            ctx.fillText(caption, sc.width / 2, sc.height - 50);
        }

        const link = document.createElement('a');
        link.download = `dreambooth-${Date.now()}.png`;
        link.href = sc.toDataURL('image/png');
        link.click();
    }

    downloadBtn.addEventListener('click', generateFinalStrip);
</script>
</body>
</html>
